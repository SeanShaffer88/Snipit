name: Windows installer cleanup and login lifecycle

on:
  push:
    branches: [verify/snipit-login-cleanup-windows]

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      LAB_VERSION: 0.28.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: '10.0.x'

      - name: Build and self-test Snipit
        run: |
          dotnet build Snipit.sln -c Release
          dotnet run --project tests/Snipit.SelfTest -c Release

      - name: Publish a Windows test candidate
        shell: pwsh
        run: |
          dotnet publish src/Snipit.App -c Release -r win-x64 --self-contained true "-p:Version=$env:LAB_VERSION" -o dist/files
          if ($LASTEXITCODE -ne 0) { throw 'Publishing Snipit failed' }
          $manifest = Get-Content seanpak.json -Raw | ConvertFrom-Json
          $manifest.version = $env:LAB_VERSION
          $manifest | ConvertTo-Json -Depth 32 | Set-Content seanpak.json

      - name: Stage the pinned FFmpeg bundle (LGPL)
        shell: pwsh
        run: |
          $pin = Get-Content tools/ffmpeg.json -Raw | ConvertFrom-Json
          Invoke-WebRequest -Uri $pin.url -OutFile ffmpeg-bundle.zip
          $hash = (Get-FileHash ffmpeg-bundle.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $pin.sha256) { throw "FFmpeg bundle SHA-256 mismatch: $hash" }
          Expand-Archive ffmpeg-bundle.zip -DestinationPath ffmpeg-bundle
          New-Item -ItemType Directory -Force dist/files/ffmpeg | Out-Null
          Copy-Item ffmpeg-bundle/*/bin/ffmpeg.exe dist/files/ffmpeg/
          Copy-Item ffmpeg-bundle/*/bin/*.dll dist/files/ffmpeg/
          Copy-Item ffmpeg-bundle/*/LICENSE.txt dist/files/ffmpeg/
          Copy-Item THIRD-PARTY-NOTICES.md dist/files/

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SeanShaffer88/SeanPak
          ref: cd30bf20c1a4ef2a62b28c3ac808ec544161fd4a
          path: .seanpak

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build SeanPak
        shell: bash
        working-directory: .seanpak
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package installer and portable build
        shell: bash
        run: |
          SP=.seanpak/target/x86_64-pc-windows-msvc/release/seanpak.exe
          "$SP" validate seanpak.json
          "$SP" pack seanpak.json dist/files --out-dir dist-seanpak --json
          "$SP" verify dist-seanpak/*-Setup.exe --json

      - name: Test installation, startup Settings, and both uninstall entry points
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
              throw 'Use a GitHub-hosted Windows runner for this test.'
          }
          $lab = Join-Path $env:RUNNER_TEMP "snipit-login-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -ErrorAction Stop -Path $lab | Out-Null
          $dest = Join-Path $lab 'installed Snipit'
          $exe = Join-Path $dest 'Snipit.exe'
          $uninstaller = Join-Path $dest 'Uninstall.exe'
          $receiptPath = Join-Path $dest 'seanpak-receipt.json'
          $expectedRun = '"' + $exe + '"'
          $arpKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\SeanPak-Snipit'
          $runKey = 'HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run'
          $keyboardKey = 'HKEY_CURRENT_USER\Control Panel\Keyboard'
          $printScreen = 'PrintScreenKeyForSnippingEnabled'
          $uiDriver = Join-Path $lab 'Test-OwnedSettings.ps1'
          $windowsPowerShell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $newSetup = (Resolve-Path "dist-seanpak/Snipit-v$env:LAB_VERSION-x64-Setup.exe").Path
          $zip = (Resolve-Path "dist-seanpak/Snipit-v$env:LAB_VERSION-x64-Portable.zip").Path
          $oldSetup = Join-Path $lab 'Snipit-v0.28.0-x64-Setup.exe'
          $settings = Join-Path $dest 'data/settings.json'

          @'
          param(
              [int]$OwnedPid,
              [ValidateSet('Enabled', 'Disabled')][string]$Availability,
              [ValidateSet('On', 'Off')][string]$Expected,
              [ValidateSet('Inspect', 'ToggleAndSave')][string]$Operation
          )
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $root = [System.Windows.Automation.AutomationElement]::RootElement
          $windowName = [System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty, 'Snipit settings')
          $windowPid = [System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::ProcessIdProperty, $OwnedPid)
          $windowCondition = [System.Windows.Automation.AndCondition]::new($windowName, $windowPid)
          $window = $null
          for ($attempt = 0; $attempt -lt 80 -and !$window; $attempt++) {
              $window = $root.FindFirst([System.Windows.Automation.TreeScope]::Children, $windowCondition)
              if (!$window) { Start-Sleep -Milliseconds 250 }
          }
          if (!$window) { throw "Settings window not found for owned Snipit process $OwnedPid" }

          function Find-Control($Name, $ControlType) {
              $byName = [System.Windows.Automation.PropertyCondition]::new(
                  [System.Windows.Automation.AutomationElement]::NameProperty, $Name)
              $byType = [System.Windows.Automation.PropertyCondition]::new(
                  [System.Windows.Automation.AutomationElement]::ControlTypeProperty, $ControlType)
              $item = $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants,
                  [System.Windows.Automation.AndCondition]::new($byName, $byType))
              if (!$item) { throw "Settings control not found: $Name" }
              $item
          }

          $checkBox = Find-Control 'Start at login' ([System.Windows.Automation.ControlType]::CheckBox)
          $expectEnabled = $Availability -eq 'Enabled'
          $toggle = $checkBox.GetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern)
          $state = $toggle.Current.ToggleState.ToString()
          if ($checkBox.Current.IsEnabled -ne $expectEnabled -or $state -ne $Expected) {
              throw "Unexpected Start at login control: enabled=$($checkBox.Current.IsEnabled), checked=$state"
          }
          if ($Operation -eq 'ToggleAndSave') {
              $toggle.Toggle()
              if ($toggle.Current.ToggleState.ToString() -eq $Expected) { throw 'Check box did not toggle' }
              $save = Find-Control 'Save' ([System.Windows.Automation.ControlType]::Button)
              $save.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
              $windowClosed = $false
              for ($attempt = 0; $attempt -lt 40 -and !$windowClosed; $attempt++) {
                  $windowClosed = !$root.FindFirst([System.Windows.Automation.TreeScope]::Children, $windowCondition)
                  if (!$windowClosed) { Start-Sleep -Milliseconds 250 }
              }
              if (!$windowClosed) { throw 'Settings did not close after Save' }
          }
          Write-Output "Owned Snipit Settings: enabled=$expectEnabled, initial checked=$Expected, $Operation."
          '@ | Set-Content -LiteralPath $uiDriver

          function Run-Native([string]$Program, [string[]]$Arguments) {
              $info = [Diagnostics.ProcessStartInfo]::new($Program)
              $info.UseShellExecute = $false
              $info.RedirectStandardOutput = $true
              $info.RedirectStandardError = $true
              $info.CreateNoWindow = $true
              foreach ($argument in $Arguments) { $info.ArgumentList.Add($argument) }
              $child = [Diagnostics.Process]::Start($info)
              try {
                  $stdout = $child.StandardOutput.ReadToEndAsync()
                  $stderr = $child.StandardError.ReadToEndAsync()
                  if (!$child.WaitForExit(120000)) {
                      $child.Kill($true)
                      throw "$Program timed out"
                  }
                  if ($child.ExitCode -ne 0) {
                      throw "$Program exited $($child.ExitCode). $($stdout.Result) $($stderr.Result)"
                  }
                  $stdout.Result
              } finally { $child.Dispose() }
          }

          function Assert-Version($Program, $Expected) {
              $actual = (Run-Native $Program @('--version')).Trim()
              if ($actual -ne "Snipit $Expected") { throw "Unexpected CLI version: $actual" }
          }

          function Read-RunValue {
              [Microsoft.Win32.Registry]::GetValue($runKey, 'Snipit', $null)
          }

          function Assert-RunValue($Expected, $Context) {
              $actual = Read-RunValue
              if ($null -eq $Expected) {
                  if ($null -eq $actual) { return }
              } elseif ($actual -is [string] -and $actual -match '^"([^"]+)"$') {
                  $target = $Matches[1]
                  if ([IO.Path]::IsPathFullyQualified($target) -and
                      [IO.Path]::GetFullPath($target) -ieq [IO.Path]::GetFullPath($Expected.Trim('"'))) { return }
              }
              throw ("Unexpected Snipit Run value after {0}: expected '{1}', got '{2}'" -f $Context, $Expected, $actual)
          }

          function New-SettingsFixture($Path) {
              New-Item -ItemType Directory -Force -Path (Split-Path -Parent $Path) | Out-Null
              '{"ShowToasts":false,"ShowTrayIcon":false,"FixedWidth":735}' | Set-Content -LiteralPath $Path
          }

          function Assert-SettingsHash($Path, $Expected) {
              $actual = (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash
              if ($actual -ne $Expected) { throw "Settings bytes changed: $Path" }
          }

          function Read-Receipt {
              Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
          }

          function Assert-Removed($Receipt, $SettingsHash) {
              $cleanupResidue = @()
              for ($attempt = 0; $attempt -lt 125; $attempt++) {
                  $cleanupResidue = @(Get-ChildItem -LiteralPath $dest -Force -File -Filter '.seanpak-uninstall-*.exe')
                  if (!(Test-Path -LiteralPath $uninstaller) -and !$cleanupResidue.Count) { break }
                  Start-Sleep -Milliseconds 200
              }
              if ($cleanupResidue.Count) { throw "Uninstall left renamed cleanup files: $($cleanupResidue.Name -join ', ')" }
              $owned = @($Receipt.files | ForEach-Object { $_.path }) + @('Snipit.exe','Uninstall.exe','seanpak-receipt.json')
              foreach ($relative in $owned) {
                  if ($relative -and (Test-Path -LiteralPath (Join-Path $dest $relative))) { throw "Uninstall left $relative" }
              }
              if (Test-Path -LiteralPath $arpKey) { throw 'Uninstall left the Windows app registration' }
              Assert-RunValue $null 'uninstall'
              Assert-SettingsHash $settings $SettingsHash
          }

          function Test-LoginSettings($Program, $Profile, [bool]$Enabled, $Expected, $Operation) {
              $prior = [Microsoft.Win32.Registry]::GetValue($keyboardKey, $printScreen, $null)
              $process = Start-Process -FilePath $Program -WindowStyle Hidden -PassThru
              try {
                  $ready = $false
                  for ($attempt = 0; $attempt -lt 50 -and !$ready; $attempt++) {
                      if ($process.HasExited) { throw "Snipit startup exited $($process.ExitCode)" }
                      Start-Sleep -Milliseconds 200
                      try { $prefs = Get-Content -LiteralPath $Profile -Raw | ConvertFrom-Json }
                      catch [System.IO.IOException] { continue }
                      $ready = $prefs.PrintScreenPriorRecorded -eq $true -and
                          [Microsoft.Win32.Registry]::GetValue($keyboardKey, $printScreen, $null) -eq 0
                  }
                  if (!$ready -or $prefs.FixedWidth -ne 735 -or $prefs.ShowToasts -ne $false) {
                      throw 'Snipit did not start with the expected profile'
                  }
                  Run-Native $Program @() | Out-Host
                  $availability = if ($Enabled) { 'Enabled' } else { 'Disabled' }
                  Run-Native $windowsPowerShell @('-NoProfile', '-STA', '-ExecutionPolicy', 'Bypass',
                      '-File', $uiDriver, '-OwnedPid', "$($process.Id)", '-Availability', $availability,
                      '-Expected', $Expected, '-Operation', $Operation) | Out-Host
              } finally {
                  if (!$process.HasExited) { Stop-Process -Id $process.Id -Force; $process.WaitForExit() }
                  $process.Dispose()
                  Run-Native $Program @('--restore-printscreen') | Out-Host
                  if ([Microsoft.Win32.Registry]::GetValue($keyboardKey, $printScreen, $null) -ne $prior) {
                      throw 'Print Screen setting was not restored after the startup smoke test'
                  }
              }
          }

          if ((Test-Path -LiteralPath $arpKey) -or $null -ne (Read-RunValue)) {
              throw 'Runner already has a registered Snipit installation or startup entry'
          }
          if (Get-Process -Name Snipit,SharpSnip -ErrorAction SilentlyContinue) { throw 'Snipit or SharpSnip is running' }
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest 'https://github.com/SeanShaffer88/Snipit/releases/download/v0.28.0/Snipit-v0.28.0-x64-Setup.exe' -OutFile $oldSetup
          $oldHash = (Get-FileHash -LiteralPath $oldSetup -Algorithm SHA256).Hash
          if ($oldHash -ne 'da76c9f282fa79a253dfa72a5bc3166175a8dae79c2f72da3a629e5717014e02') {
              throw "Published v0.28.0 baseline installer SHA-256 mismatch: $oldHash"
          }
          $checksums = Get-Content dist-seanpak/SHA256SUMS.txt
          foreach ($package in @($newSetup, $zip)) {
              $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash
              $name = Split-Path -Leaf $package
              if ($checksums -notcontains "$hash  $name") { throw "Generated package SHA-256 mismatch: $name" }
              Write-Host "$hash  $name"
          }
          $setupHash = (Get-FileHash -LiteralPath $newSetup -Algorithm SHA256).Hash

          try {
              Run-Native $newSetup @('--install','--to',$dest,'--json','--silent') | Out-Host
              Assert-Version $exe $env:LAB_VERSION
              Assert-RunValue $expectedRun 'fresh install'
              $receipt = Read-Receipt
              if ($receipt.app -ne 'Snipit' -or $receipt.version -ne $env:LAB_VERSION) { throw 'Wrong fresh install receipt' }
              New-SettingsFixture $settings
              $fixtureHash = (Get-FileHash -LiteralPath $settings -Algorithm SHA256).Hash
              $registeredCommand = Get-ItemPropertyValue -LiteralPath $arpKey -Name UninstallString
              if ($registeredCommand -notmatch '^"([^"]+)" --uninstall --to "([^"]+)"$' -or
                  [IO.Path]::GetFullPath($Matches[1]) -ine [IO.Path]::GetFullPath($uninstaller) -or
                  [IO.Path]::GetFullPath($Matches[2]) -ine [IO.Path]::GetFullPath($dest)) {
                  throw "Unexpected registered uninstall command: $registeredCommand"
              }
              Run-Native $uninstaller @('--uninstall','--to',$dest,'--json','--silent') | Out-Host
              Assert-Removed $receipt $fixtureHash
              Write-Host 'Fresh install enabled login startup. Registered Uninstall.exe removed itself, payload, and startup entry. Settings SHA-256 unchanged.'

              Run-Native $oldSetup @('--install','--to',$dest,'--json','--silent') | Out-Host
              Assert-Version $exe '0.28.0'
              Assert-RunValue $null 'v0.28.0 baseline install'
              Run-Native $newSetup @('--install','--to',$dest,'--json','--silent') | Out-Host
              Assert-Version $exe $env:LAB_VERSION
              $receipt = Read-Receipt
              if ($receipt.app -ne 'Snipit' -or $receipt.version -ne $env:LAB_VERSION -or
                  $receipt.mode -ne 'upgrade' -or $receipt.previousVersion -ne '0.28.0') {
                  throw "Wrong upgrade receipt: $($receipt | ConvertTo-Json -Compress)"
              }
              Assert-SettingsHash $settings $fixtureHash
              Assert-RunValue $expectedRun 'upgrade from v0.28.0'

              Test-LoginSettings $exe $settings $true 'On' 'ToggleAndSave'
              Assert-RunValue $null 'turning startup off in Settings'
              Run-Native $newSetup @('--install','--to',$dest,'--json','--silent') | Out-Host
              Assert-RunValue $null 'reinstall after Settings opt-out'
              Test-LoginSettings $exe $settings $true 'Off' 'ToggleAndSave'
              Assert-RunValue $expectedRun 'turning startup on in Settings after restarting Snipit'

              $portable = Join-Path $lab 'portable Snipit'
              Expand-Archive -LiteralPath $zip -DestinationPath $portable
              $portableExe = Join-Path $portable 'Snipit.exe'
              $portableSettings = Join-Path $portable 'data/settings.json'
              New-SettingsFixture $portableSettings
              Assert-Version $portableExe $env:LAB_VERSION
              Test-LoginSettings $portableExe $portableSettings $false 'Off' 'Inspect'
              Assert-RunValue $expectedRun 'portable launch and Settings inspection'

              $retainedHash = (Get-FileHash -LiteralPath $settings -Algorithm SHA256).Hash
              $receipt = Read-Receipt
              Run-Native $newSetup @('--uninstall','--to',$dest,'--json','--silent') | Out-Host
              Assert-Removed $receipt $retainedHash
              if ((Get-FileHash -LiteralPath $newSetup -Algorithm SHA256).Hash -ne $setupHash) {
                  throw 'External Setup changed during uninstall'
              }
              Write-Host 'v0.28.0 upgrade, Settings save for login off and on, opt-out through reinstall, portable Settings, and external Setup uninstall passed. Settings SHA-256 unchanged by uninstall.'

              $unrelated = Join-Path $lab 'unrelated owned fixture'
              New-Item -ItemType Directory -Path $unrelated | Out-Null
              $foreignUninstaller = Join-Path $unrelated 'Uninstall.exe'
              'Unrelated fixture. This file is never executed.' | Set-Content -LiteralPath $foreignUninstaller
              $foreignHash = (Get-FileHash -LiteralPath $foreignUninstaller -Algorithm SHA256).Hash
              Run-Native $newSetup @('--uninstall','--to',$unrelated,'--json','--silent') | Out-Host
              if ((Get-FileHash -LiteralPath $foreignUninstaller -Algorithm SHA256).Hash -ne $foreignHash) {
                  throw 'External Setup changed an unrelated Uninstall.exe without a Snipit receipt'
              }
              Write-Host 'External Setup preserved the unrelated Uninstall.exe fixture.'
          } finally {
              if (Test-Path -LiteralPath $receiptPath) {
                  Run-Native $newSetup @('--uninstall','--to',$dest,'--json','--silent') | Out-Host
              }
          }
