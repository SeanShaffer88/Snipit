name: Release

# Tag-triggered release: build + self-test, publish the app self-contained,
# package it with Inno Setup (the standing packager for Snipit — per-user,
# x64, desktop/start-menu shortcuts + Start at login), and attach the three
# assets to the GitHub Release.
# Release notes are this version's own CHANGELOG.md section, nothing else.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Build + self-test
        run: |
          dotnet build Snipit.sln -c Release
          dotnet run --project tests/Snipit.SelfTest -c Release

      - name: Publish app (self-contained win-x64)
        run: dotnet publish src/Snipit.App -c Release -r win-x64 --self-contained true -o dist/files

      - name: Stage the pinned FFmpeg bundle (LGPL)
        shell: pwsh
        run: |
          $pin = Get-Content tools/ffmpeg.json | ConvertFrom-Json
          Invoke-WebRequest -Uri $pin.url -OutFile ffmpeg-bundle.zip
          $hash = (Get-FileHash ffmpeg-bundle.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $pin.sha256) { throw "FFmpeg bundle SHA256 mismatch: got $hash, pin says $($pin.sha256)" }
          Expand-Archive ffmpeg-bundle.zip -DestinationPath ffmpeg-bundle
          New-Item -ItemType Directory -Force dist/files/ffmpeg | Out-Null
          Copy-Item ffmpeg-bundle/*/bin/ffmpeg.exe dist/files/ffmpeg/
          Copy-Item ffmpeg-bundle/*/bin/*.dll dist/files/ffmpeg/
          Copy-Item ffmpeg-bundle/*/LICENSE.txt dist/files/ffmpeg/
          Copy-Item THIRD-PARTY-NOTICES.md dist/files/

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $iscc = Get-ChildItem -Path "C:\Program Files*\Inno Setup*\ISCC.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) {
            "ISCC.exe not found under 'C:\Program Files*\Inno Setup*'" | Set-Content iscc-output.txt
            Get-ChildItem -Path "C:\Program Files*\Inno Setup*" -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object FullName | ForEach-Object { $_.FullName } | Set-Content iscc-output.txt -Append
            exit 1
          }
          "ISCC path: $iscc" | Set-Content iscc-output.txt
          "--- ISCC output ---" | Add-Content iscc-output.txt
          $out = & $iscc installer.iss 2>&1
          "$out" | Out-String | Set-Content iscc-output.txt -Append
          "--- ISCC exit: $LASTEXITCODE ---" | Add-Content iscc-output.txt
          Write-Host "$out"
          exit $LASTEXITCODE

      - name: Upload the ISCC diagnostic log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iscc-diagnostic
          path: iscc-output.txt
          if-no-files-found: ignore

      - name: Compress the portable ZIP (Deflate, same payload)
        shell: pwsh
        run: |
          $zip = "dist-installer/Snipit-0.29.0-Portable.zip"
          Compress-Archive -Path "dist/files/*" -DestinationPath $zip -CompressionLevel Optimal -Force
          $entries = ([System.IO.Compression.ZipFile]::OpenRead($zip)).Entries
          if ($entries.Count -lt 50) { throw "Portable ZIP has too few entries ($($entries.Count))" }
          Write-Host "Portable ZIP contains $($entries.Count) entries, $((Get-Item $zip).Length) bytes"

      - name: SHA256SUMS.txt
        shell: pwsh
        run: |
          $lines = @()
          Get-ChildItem dist-installer -Filter *-Setup.exe | Sort-Object Name | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | ForEach-Object { $lines += $_ }
          Get-ChildItem dist-installer -Filter *-Portable.zip | Sort-Object Name | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | ForEach-Object { $lines += $_ }
          $lines | Set-Content dist-installer/SHA256SUMS.txt -Encoding ascii
          Get-Content dist-installer/SHA256SUMS.txt

      - name: Extract release notes (this version's CHANGELOG section only)
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create GitHub Release with the installer assets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: release-notes.md
          files: |
            dist-installer/*-Setup.exe
            dist-installer/*-Portable.zip
            dist-installer/SHA256SUMS.txt
